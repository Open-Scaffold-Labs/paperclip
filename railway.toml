# Railway deployment config for OpenScaffold's Paperclip instance
# Deploys from the repo's Dockerfile with a Railway-managed Postgres addon

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node --import ./server/node_modules/tsx/dist/loader.mjs server/dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "paperclip"
protocol = "tcp"
internalPort = 3100
